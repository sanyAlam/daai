[project]
name = "daai-api"
version = "0.1.0"
description = "DAAI Console governance API"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn>=0.35.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "psycopg[binary,pool]>=3.2.9,<4.0.0",
  "PyJWT>=2.10.0,<3.0.0",
  "cryptography>=44.0.0,<46.0.0",
  "openai>=1.99.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "httpx>=0.28.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
