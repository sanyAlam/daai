[project]
name = "daai-python"
version = "0.1.0"
description = "DAAI Console Python SDK"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
